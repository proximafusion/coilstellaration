# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: pretty-format-json
        args: ["--autofix", "--indent", "4", "--no-sort-keys"]
        # Tool-written JSON: Jupyter and the devcontainer CLI pick their own
        # indent and rewrite these files on every save.
        exclude: ^(.*\.ipynb|\.devcontainer/devcontainer-lock\.json)$
-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
    -   id: shellcheck
        args: ["--severity=warning"]
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version in uv.lock.
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
- repo: https://github.com/RobertCraigie/pyright-python
  rev: v1.1.401
  hooks:
  - id: pyright
    # leaderboard/ has ~36 pre-existing type errors; drop this once they're fixed.
    exclude: ^leaderboard/
