# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: check-toml
    # Blocks commits made directly on main (its default). CI skips it, since a
    # push to main runs on main.
    -   id: no-commit-to-branch
    -   id: pretty-format-json
        args: ["--autofix", "--indent", "4", "--no-sort-keys"]
        # Tool-written JSON: Jupyter and the devcontainer CLI pick their own
        # indent and rewrite these files on every save.
        exclude: ^(.*\.ipynb|\.devcontainer/devcontainer-lock\.json)$
-   repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
    -   id: check-github-workflows
    -   id: check-dependabot
-   repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
    -   id: zizmor
-   repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
    # Fails if uv.lock is out of date with pyproject.toml.
    -   id: uv-lock
-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
    -   id: shellcheck
        args: ["--severity=warning"]
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version in uv.lock.
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
- repo: https://github.com/RobertCraigie/pyright-python
  rev: v1.1.414
  hooks:
  - id: pyright
