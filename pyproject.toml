[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "constellaration_update"
dynamic = ["version"]
description = 'Code for analyzing and evaluating stellarator boundaries and coilsets'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Jan-Hendrik Ewers", email = "jhewers@proximafusion.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "constellaration==0.2.6",
  "beartype",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://github.com/proximafusion/constellaration_update#readme"
Issues = "https://github.com/proximafusion/constellaration_update/issues"
Source = "https://github.com/proximafusion/constellaration_update"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/constellaration_update/__about__.py"

[project.optional-dependencies]
test = ["pytest"]
lint = ["pre-commit"]

[tool.hatch.envs.default]
path = "venv"

[tool.hatch.envs.test]
dependencies = ["pytest"]

[tool.hatch.envs.lint]
extra-dependencies = [
  "ruff"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
packages = ["src/constellaration_update"]
include = [
  "src/constellaration_update/**",
  "README.md",
  "LICENSE",
]

[tool.coverage.run]
source_pkgs = ["constellaration_update", "tests"]
branch = true
parallel = true
omit = [
  "src/constellaration_update/__about__.py",
]

[tool.coverage.paths]
constellaration_update = ["src/constellaration_update", "*/constellaration_update/src/constellaration_update"]
tests = ["tests", "*/constellaration_update/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = [
  "ARG",      # flake8-unused-arguments
  "EXE",      # flake8-executable
  "E501",     # line-too-long
  "FURB",     # refurb
  "G",        # flake8-logging-format
  "ICN",      # flake8-import-conventions
  "NPY",      # NumPy specific rules
  "PD",       # pandas-vet
  "PT",       # flake8-pytest-style
  "PTH",      # flake8-use-pathlib
  "YTT",      # flake8-2020
]
ignore = [
  "F722",     # Disable 'forward-annotation-syntax-error' for jaxtyping compatibility, see https://docs.kidger.site/jaxtyping/faq/#flake8-or-ruff-are-throwing-an-error
]

[tool.isort]
profile = "black"

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = "venv"
# Ignore files that import modules not yet ported; remove entries as tasks complete.
ignore = [
  "src/constellaration_update/coilset/utils.py",  # metrics (Task 4), types (Task 8)
  "src/constellaration_update/coilset/optimization.py",  # types (Task 8)
  "src/constellaration_update/metrics/metrics.py",  # types (Task 8)
  "tests/metrics/metrics_validation_test.py",  # geometry.curve stubs produce None-type errors
  "tests/metrics/metrics_test.py",  # desc fallback None-types; unskipped in Task 8
  "src/constellaration_update/checkpoint/flax_nnx.py",  # flax/orbax not in env until Task 16
  "tests/checkpoint/flax_nnx_test.py",  # flax/orbax not in env until Task 16
]
