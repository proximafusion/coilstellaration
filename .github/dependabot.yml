# Keeps the GitHub Actions in .github/workflows up to date, including the ones
# pinned to a commit SHA. Python dependencies aren't covered: pyproject.toml
# holds several back on purpose (onnx, equinox, pandas-stubs), so they're
# bumped by hand with `uv lock --upgrade-package`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR per month for all actions instead of one per action.
    groups:
      github-actions:
        patterns: ["*"]
