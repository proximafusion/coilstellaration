# Keeps the GitHub Actions in .github/workflows, the hook revs in
# .pre-commit-config.yaml (including the ones pinned to a commit SHA) and
# uv.lock up to date. The ruff-pre-commit rev and ruff in uv.lock come in
# separate PRs; land them together so the two stay in step.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Skip releases younger than a week, so a compromised or broken release is
    # likely to be pulled before it gets here.
    cooldown:
      default-days: 7
    # One PR per month for all actions instead of one per action.
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]

  # Only uv.lock: pyproject.toml holds several dependencies back on purpose
  # (onnx, equinox, pandas-stubs), so Dependabot upgrades within those bounds,
  # like `uv lock --upgrade`. Moving a bound stays a manual change.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
