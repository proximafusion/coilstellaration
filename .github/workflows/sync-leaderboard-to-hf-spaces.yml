name: Sync leaderboard to Hugging Face Spaces

# Both Spaces get an allowlist of files (see `include`) and run leaderboard/app.py;
# COILBENCH_ROLE (a Space variable) picks leaderboard vs runner. Hugging Face only
# reads Space config from the root README's front matter, and installs from a root
# requirements.txt / packages.txt, so those are generated here rather than kept
# in the repo.

on:
  push:
    branches: [main]
    paths:
      - "leaderboard/**"
      - "!leaderboard/tests/**"
      - "src/**"
      - pyproject.toml
      - uv.lock
      - .github/workflows/sync-leaderboard-to-hf-spaces.yml
      - .github/scripts/wait_for_space.py
  workflow_dispatch:

# A newer push supersedes a sync that is still running, instead of both uploading
# at once.
concurrency:
  group: sync-leaderboard-to-hf-spaces
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: "Write the Space README, requirements.txt and packages.txt"
        run: |
          cat leaderboard/space.evaluator.md > README.md
          # This package's dependencies plus the leaderboard group, pinned to
          # uv.lock. Not the package itself: HF runs `pip install -r` with only
          # requirements.txt mounted, so a `.` line has nothing to install.
          # leaderboard/app.py puts src/ on sys.path instead.
          uv export --frozen --no-default-groups --group leaderboard \
            --no-emit-project --no-hashes --no-editable --no-header \
            -o requirements.txt
          # Build deps for source-built extensions (booz-xform: NetCDF + CMake).
          printf '%s\n' cmake gfortran libnetcdf-dev libnetcdf-c++4-dev \
            ninja-build pkg-config > packages.txt

      - uses: huggingface/hub-sync@fdffea8e04104d0bd4e3181c5feb3025f0433ff5 # v0.3.0
        name: "Updated proxima-fusion/coilstellaration-bench-evaluator"
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: proxima-fusion/coilstellaration-bench-evaluator
          hf_token: ${{ secrets.HF_TOKEN }}
          hf_version: "2.4.0"
          # Only what the Space runs: the generated README, requirements.txt and
          # packages.txt, the coilstellaration package and the leaderboard app.
          include: |
            README.md
            requirements.txt
            packages.txt
            LICENSE
            src/*
            leaderboard/*
          exclude: |
            leaderboard/tests/*

      # hub-sync returns once the upload is done; fail the job if the Space then
      # doesn't build and start.
      - name: "Wait for proxima-fusion/coilstellaration-bench-evaluator to build and start"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --no-project --with "huggingface_hub>=1.14,<2" \
            python .github/scripts/wait_for_space.py \
            proxima-fusion/coilstellaration-bench-evaluator 60

  sync-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: "Write the Space README, requirements.txt and packages.txt"
        run: |
          cat leaderboard/space.leaderboard.md > README.md
          # This package's dependencies plus the leaderboard group, pinned to
          # uv.lock. Not the package itself: HF runs `pip install -r` with only
          # requirements.txt mounted, so a `.` line has nothing to install.
          # leaderboard/app.py puts src/ on sys.path instead.
          uv export --frozen --no-default-groups --group leaderboard \
            --no-emit-project --no-hashes --no-editable --no-header \
            -o requirements.txt
          # Build deps for source-built extensions (booz-xform: NetCDF + CMake).
          printf '%s\n' cmake gfortran libnetcdf-dev libnetcdf-c++4-dev \
            ninja-build pkg-config > packages.txt

      - uses: huggingface/hub-sync@fdffea8e04104d0bd4e3181c5feb3025f0433ff5 # v0.3.0
        name: "Updated proxima-fusion/coilstellaration-bench"
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: proxima-fusion/coilstellaration-bench
          hf_token: ${{ secrets.HF_TOKEN }}
          hf_version: "2.4.0"
          # Only what the Space runs: the generated README, requirements.txt and
          # packages.txt, the coilstellaration package and the leaderboard app.
          include: |
            README.md
            requirements.txt
            packages.txt
            LICENSE
            src/*
            leaderboard/*
          exclude: |
            leaderboard/tests/*

      # hub-sync returns once the upload is done; fail the job if the Space then
      # doesn't build and start.
      - name: "Wait for proxima-fusion/coilstellaration-bench to build and start"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --no-project --with "huggingface_hub>=1.14,<2" \
            python .github/scripts/wait_for_space.py \
            proxima-fusion/coilstellaration-bench 60
