name: Sync leaderboard to Hugging Face Spaces

# Both Spaces get the whole repo (minus the excludes) and run leaderboard/app.py;
# COILBENCH_ROLE (a Space variable) picks leaderboard vs runner. Hugging Face only
# reads Space config from the root README's front matter, and installs from a root
# requirements.txt / packages.txt, so those are generated here rather than kept
# in the repo.

on:
  push:
    branches: [main]
    paths:
      - "leaderboard/**"
      - "!leaderboard/tests/**"
      - "src/**"
      - pyproject.toml
      - uv.lock
      - .github/workflows/sync-leaderboard-to-hf-spaces.yml
  workflow_dispatch:

jobs:
  sync-evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: "Write the Space README, requirements.txt and packages.txt"
        run: |
          cat leaderboard/space.evaluator.md > README.md
          # `.` (this package) plus the leaderboard group, pinned to uv.lock.
          uv export --frozen --no-default-groups --group leaderboard \
            --no-hashes --no-editable --no-header -o requirements.txt
          # Build deps for source-built extensions (booz-xform: NetCDF + CMake).
          printf '%s\n' cmake gfortran libnetcdf-dev libnetcdf-c++4-dev \
            ninja-build pkg-config > packages.txt

      - uses: huggingface/hub-sync@v0.3.0
        name: "Updated proxima-fusion/coilstellaration-bench-evaluator"
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: proxima-fusion/coilstellaration-bench-evaluator
          hf_token: ${{ secrets.HF_TOKEN }}
          hf_version: "2.4.0"
          exclude: |
            analysis/
            examples/
            scripts/

  sync-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: "Write the Space README, requirements.txt and packages.txt"
        run: |
          cat leaderboard/space.leaderboard.md > README.md
          # `.` (this package) plus the leaderboard group, pinned to uv.lock.
          uv export --frozen --no-default-groups --group leaderboard \
            --no-hashes --no-editable --no-header -o requirements.txt
          # Build deps for source-built extensions (booz-xform: NetCDF + CMake).
          printf '%s\n' cmake gfortran libnetcdf-dev libnetcdf-c++4-dev \
            ninja-build pkg-config > packages.txt

      - uses: huggingface/hub-sync@v0.3.0
        name: "Updated proxima-fusion/coilstellaration-bench"
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: proxima-fusion/coilstellaration-bench
          hf_token: ${{ secrets.HF_TOKEN }}
          hf_version: "2.4.0"
          exclude: |
            analysis/
            examples/
            scripts/
