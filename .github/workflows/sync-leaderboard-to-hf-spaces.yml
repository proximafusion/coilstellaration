name: Sync leaderboard to Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - "leaderboard/**"
      - "!leaderboard/tests/**"
      - "src/**"
      - pyproject.yaml
      - uv.lock
  workflow_dispatch:

jobs:
  sync-evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Set the Space front matter"
        run: |
          cat leaderboard/space.evaluator.md > README.md

      - uses: huggingface/hub-sync@v0.3.0
        name: "Updated proxima-fusion/coilstellaration-bench-evaluator"
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: proxima-fusion/coilstellaration-bench-evaluator
          hf_token: ${{ secrets.HF_TOKEN }}
          exclude: |
            analysis/
            examples/
            scripts/

  sync-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Set the Space front matter"
        run: |
          cat leaderboard/space.leaderboard.md > README.md

      - uses: huggingface/hub-sync@v0.3.0
        name: "Updated proxima-fusion/coilstellaration-bench"
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: proxima-fusion/coilstellaration-bench
          hf_token: ${{ secrets.HF_TOKEN }}
          exclude: |
            analysis/
            examples/
            scripts/
