[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coilstellaration-bench"
version = "0.1.0"
description = "Gradio leaderboard for the Coilstellaration benchmark."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "APScheduler",
    "datasets",
    "gradio[oauth]",
    "gradio_leaderboard==0.0.13",
    "gradio_client",
    "huggingface-hub>=0.18.0",
    "matplotlib",
    "numpy",
    "pandas",
    "python-dateutil",
    "tqdm",
    "transformers",
    "tokenizers>=0.15.0",
    "sentencepiece",
    "coilstellaration @ git+ssh://git@github.com/proximafusion/coilstellaration.git@03d1dc2",
]

[dependency-groups]
dev = [
    "black",
    "isort",
    "ruff",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = ["E501"] # line too long (black is taking care of this)
line-length = 119
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]

[tool.isort]
profile = "black"
line_length = 119

[tool.black]
line-length = 119
