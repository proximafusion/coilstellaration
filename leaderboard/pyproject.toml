[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coilstellaration-bench"
version = "0.1.0"
description = "Gradio leaderboard for the Coilstellaration benchmark."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "APScheduler",
    "datasets",
    "gradio[oauth]==6.17.3",
    "gradio_client==2.5.0",
    "huggingface-hub>=0.18.0",
    "matplotlib",
    "numpy",
    "pandas",
    "python-dateutil",
    "tqdm",
    "onnxruntime",
]

[dependency-groups]
dev = [
    "black",
    "isort",
    "ruff",
    "pre-commit",
    "pytest",
    "onnx",
    # Export-time only (scripts/export_coilstellaration_onnx.py); not needed to
    # run the benchmark, which only consumes the resulting .onnx via onnxruntime.
    "jax2onnx",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 119

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = ["E501"] # line too long (black is taking care of this)
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]

[tool.isort]
profile = "black"
line_length = 119

[tool.black]
line-length = 119

[tool.pytest.ini_options]
testpaths = ["tests"]
