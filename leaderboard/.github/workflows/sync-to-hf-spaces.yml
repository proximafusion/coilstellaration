name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tests/**'
      - '.github/**'
      - '.pre-commit-config.yaml'
  workflow_dispatch:

concurrency:
  group: sync-to-hf-spaces
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Fetch all LFS objects across history
        # checkout's lfs:true only fetches objects for the HEAD working tree.
        # The force-push below mirrors full history, which requires every LFS
        # object referenced anywhere in history (e.g. files since renamed or
        # removed). Without this, the push fails with "missing" LFS objects.
        run: git lfs fetch --all origin

      - name: Push to evaluator (worker) Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force \
            "https://jhewers-pf:${HF_TOKEN}@huggingface.co/spaces/jhewers-pf/coilstellaration-bench-evaluator" \
            HEAD:main

      - name: Push to leaderboard Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force \
            "https://jhewers-pf:${HF_TOKEN}@huggingface.co/spaces/jhewers-pf/coilstellaration-bench" \
            HEAD:main
